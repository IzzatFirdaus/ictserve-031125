# ICTServe Redis Configuration for WSL Development Environment
# Optimized for Windows host connectivity and Laravel integration

################################## NETWORK #####################################

# Bind to all interfaces to allow Windows host connectivity
bind 0.0.0.0

# Accept connections on the standard Redis port
port 6379

# TCP listen() backlog
tcp-backlog 511

# Close the connection after a client is idle for N seconds (0 to disable)
timeout 0

# TCP keepalive
tcp-keepalive 300

################################# TLS/SSL ######################################

# Disable TLS for development
# tls-port 0

################################# GENERAL #####################################

# Run as a daemon
daemonize yes

# Set the number of databases
databases 16

# Always show a logo when starting Redis
always-show-logo yes

################################ SNAPSHOTTING  ################################

# Save the DB on disk for development
save 900 1
save 300 10
save 60 10000

# Compress string objects using LZF when dump .rdb databases
rdbcompression yes

# Checksum the RDB file
rdbchecksum yes

# The filename where to dump the DB
dbfilename dump.rdb

# The working directory
dir /var/lib/redis

################################# REPLICATION #################################

# Disable replication for development
# replicaof <masterip> <masterport>

################################## SECURITY ###################################

# Disable protected mode for development (WARNING: Only for development!)
protected-mode no

# Require clients to issue AUTH <PASSWORD> before processing any other commands
# Uncomment and set a password for production
# requirepass ictserve-redis-dev

################################### CLIENTS ####################################

# Set the max number of connected clients
maxclients 10000

############################## MEMORY MANAGEMENT #############################

# Set a memory usage limit for development
maxmemory 256mb

# Memory policy when max memory is reached
maxmemory-policy allkeys-lru

############################# LAZY FREEING ####################################

lazyfree-lazy-eviction no
lazyfree-lazy-expire no
lazyfree-lazy-server-del no
replica-lazy-flush no

############################ KERNEL OOM CONTROL ##############################

oom-score-adj no

############################ KERNEL TRANSPARENT HUGEPAGE CONTROL #############

disable-thp yes

############################## APPEND ONLY FILE ###############################

# Enable AOF for better durability in development
appendonly yes

# The name of the append only file
appendfilename "appendonly.aof"

# Fsync policy for AOF
appendfsync everysec

# Rewrite the AOF file in background when it gets too big
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

################################ LUA SCRIPTING  ###############################

# Max execution time of a Lua script in milliseconds
lua-time-limit 5000

################################## SLOW LOG ###################################

# Log queries slower than this many microseconds
slowlog-log-slower-than 10000

# Maximum length of the slow log
slowlog-max-len 128

################################ LATENCY MONITOR ##############################

# Enable latency monitoring
latency-monitor-threshold 100

############################# EVENT NOTIFICATION ##############################

# Enable keyspace notifications for Laravel
notify-keyspace-events "Ex"

############################### ADVANCED CONFIG ###############################

# Hash table settings
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# List settings
list-max-ziplist-size -2
list-compress-depth 0

# Set settings
set-max-intset-entries 512

# Sorted set settings
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# HyperLogLog settings
hll-sparse-max-bytes 3000

# Streams settings
stream-node-max-bytes 4096
stream-node-max-entries 100

# Active rehashing
activerehashing yes

# Client output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Client query buffer limit
client-query-buffer-limit 1gb

# Protocol buffer limit
proto-max-bulk-len 512mb

# Frequency of rehashing
hz 10

# Enable dynamic HZ
dynamic-hz yes

# AOF rewrite incremental fsync
aof-rewrite-incremental-fsync yes

# RDB save incremental fsync
rdb-save-incremental-fsync yes

################################## LOGGING ####################################

# Specify the server verbosity level
loglevel notice

# Specify the log file name
logfile /var/log/redis/redis-server.log

# Enable syslog
# syslog-enabled yes

# Specify the syslog identity
# syslog-ident redis

# Specify the syslog facility
# syslog-facility local0

################################## MODULES #####################################

# Load modules at startup
# loadmodule /path/to/my_module.so

################################## ICTServe Specific Settings ################

# Optimizations for Laravel/ICTServe usage
# These settings are tuned for typical Laravel application patterns

# Increase timeout for long-running operations
timeout 300

# Optimize for Laravel session storage
maxmemory-samples 5

# Enable keyspace notifications for Laravel broadcasting
notify-keyspace-events "KEA"