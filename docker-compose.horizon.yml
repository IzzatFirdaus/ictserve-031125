version: '3.8'

services:
  horizon:
    image: php:8.4-cli
    working_dir: /var/www
    volumes:
      - .:/var/www
    command: php artisan horizon
    depends_on:
      - redis
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_DATABASE=ictserve
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - horizon-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - horizon-network

networks:
  horizon-network:
    driver: bridge