name: Markdown Lint

on:
  pull_request:
    paths: ['**/*.md']
  push:
    branches: [develop, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install -g markdownlint-cli

      - run: markdownlint "**/*.md" --config .markdownlint.json --ignore vendor --ignore node_modules
