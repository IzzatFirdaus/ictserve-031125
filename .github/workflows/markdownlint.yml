name: Markdown Lint

on:
  pull_request:
    paths: ['**/*.md']
  push:
    branches: ['develop', 'main']

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli
      - name: Run markdownlint
        run: markdownlint "**/*.md" --config .markdownlint.json --ignore vendor --ignore node_modules