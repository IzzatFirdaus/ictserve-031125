name: Node Version Check

on:
  push:
    branches: [ 'develop', 'main' ]
  pull_request:
    branches: [ 'develop', 'main' ]

jobs:
  node-version:
    name: Ensure Node v22.14.0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Verify node version
        run: |
          node --version
          npm --version

      - name: Run node version check script
        run: |
          node scripts/dev/check-node-version.js

      - name: Install and Build (sanity)
        run: |
          npm ci
          npm run build
