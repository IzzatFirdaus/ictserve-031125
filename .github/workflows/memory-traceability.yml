name: Memory Traceability Check

on:
  pull_request:
    branches: [ develop, main ]

jobs:
  verify-work-session:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Identify changed files
        id: changes
        run: |
          git fetch origin ${{ github.base_ref }}
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...${{ github.sha }})
          echo "CHANGED<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Fail when memory-system files changed without work_session update
        run: |
          changed="${{ steps.changes.outputs.CHANGED }}"
          echo "Files changed:${changed}"

          # Patterns that require a work_session traceability entry
          require_patterns=('app/Console/Commands/SyncMemoryMarkdown.php' 'app/Services/MemoryGraphService.php' 'database/migrations/*create_memory*' '.github/instructions/memory.instructions.md' 'app/Http/Controllers/Api/MemoryController.php' 'memory.jsonl')

          requires_trace=false
          for p in "${require_patterns[@]}"; do
            if echo "$changed" | grep -q -E "^${p//\*/.*}$"; then
              requires_trace=true
            fi
          done

          if [ "$requires_trace" = true ]; then
            # memory.jsonl must be updated with a work_session entry when memory system files changed
            if echo "$changed" | grep -q "memory.jsonl"; then
              # Ensure new content contains 'work_session' entity
              if ! git diff --no-prefix origin/${{ github.base_ref }}...${{ github.sha }} -- memory.jsonl | grep -q '"entityType":"work_session"'; then
                echo "ERROR: memory.jsonl was modified but does not contain a work_session entry. Add a work_session describing the change." >&2
                exit 1
              fi
            else
              echo "ERROR: memory system files changed but 'memory.jsonl' was not updated with a work_session entry. Add a trace entry to memory.jsonl." >&2
              exit 1
            fi
          fi

          echo "Traceability check passed."
