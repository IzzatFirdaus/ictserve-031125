; ICTServe PHP-FPM Pool Configuration
; This file configures the www pool for Laravel applications in Docker containers
; It overrides/extends default PHP-FPM settings for optimal performance

[www]

; Pool user and group (matches container www-data)
user = www-data
group = www-data

; Listen on TCP socket instead of Unix socket for Docker networking
listen = 9000

; Process management
pm = dynamic
pm.max_children = 20
pm.start_servers = 5
pm.min_spare_servers = 3
pm.max_spare_servers = 10
pm.max_requests = 500

; Performance tuning
pm.process_idle_timeout = 10s
request_terminate_timeout = 60s

; Logging
access.log = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no

; Environment variables passthrough for Laravel
clear_env = no

; Security
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on

; PHP.ini overrides specific to this pool
php_value[memory_limit] = 256M
php_value[max_execution_time] = 60
php_value[upload_max_filesize] = 20M
php_value[post_max_size] = 20M
php_value[max_input_vars] = 3000

; Session handling
php_value[session.save_handler] = redis
php_value[session.save_path] = "tcp://redis:6379"

; Opcache settings for production
php_value[opcache.enable] = 1
php_value[opcache.memory_consumption] = 256
php_value[opcache.interned_strings_buffer] = 16
php_value[opcache.max_accelerated_files] = 20000
php_value[opcache.validate_timestamps] = 0
php_value[opcache.save_comments] = 1
php_value[opcache.fast_shutdown] = 1
