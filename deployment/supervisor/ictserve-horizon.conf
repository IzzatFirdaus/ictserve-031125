# ICTServe Laravel Horizon Supervisor Configuration
# 
# This configuration manages the Laravel Horizon daemon process for
# the ICTServe queue management system.
#
# Requirements: 23.1, 23.4
# Location: /etc/supervisor/conf.d/ictserve-horizon.conf

[program:ictserve-horizon]
process_name=%(program_name)s
command=php /var/www/ictserve/artisan horizon
directory=/var/www/ictserve
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/ictserve/storage/logs/horizon.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stopwaitsecs=3600
killasgroup=true
priority=999

# Environment variables
environment=LARAVEL_ENV="production"

# Process management
startsecs=10
startretries=3
exitcodes=0,2
stopsignal=TERM

# Logging
stderr_logfile=/var/www/ictserve/storage/logs/horizon-error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10

# Resource limits
rlimit_nofile=65536