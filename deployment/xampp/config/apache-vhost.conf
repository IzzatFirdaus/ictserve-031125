# ICTServe Apache Virtual Host Configuration
# Copy this to C:\xampp\apache\conf\extra\httpd-vhosts.conf
# Or include it in your Apache configuration

<VirtualHost *:80>
    ServerName ictserve.local
    ServerAlias www.ictserve.local
    DocumentRoot "C:/path/to/ictserve/public"
    
    <Directory "C:/path/to/ictserve/public">
        AllowOverride All
        Require all granted
        
        # Enable URL rewriting
        RewriteEngine On
        
        # Handle Angular/Vue Router (if applicable)
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^(.*)$ index.php [QSA,L]
    </Directory>
    
    # Security headers
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    
    # PHP configuration
    php_value upload_max_filesize 64M
    php_value post_max_size 64M
    php_value max_execution_time 300
    php_value memory_limit 512M
    
    # Logging
    ErrorLog "logs/ictserve_error.log"
    CustomLog "logs/ictserve_access.log" combined
</VirtualHost>

# HTTPS Virtual Host (optional)
<VirtualHost *:443>
    ServerName ictserve.local
    ServerAlias www.ictserve.local
    DocumentRoot "C:/path/to/ictserve/public"
    
    # SSL Configuration
    SSLEngine on
    SSLCertificateFile "conf/ssl.crt/server.crt"
    SSLCertificateKeyFile "conf/ssl.key/server.key"
    
    <Directory "C:/path/to/ictserve/public">
        AllowOverride All
        Require all granted
        
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^(.*)$ index.php [QSA,L]
    </Directory>
    
    # Security headers for HTTPS
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY
    Header always set X-XSS-Protection "1; mode=block"
    
    # PHP configuration
    php_value upload_max_filesize 64M
    php_value post_max_size 64M
    php_value max_execution_time 300
    php_value memory_limit 512M
    
    ErrorLog "logs/ictserve_ssl_error.log"
    CustomLog "logs/ictserve_ssl_access.log" combined
</VirtualHost>

# Add to your hosts file (C:\Windows\System32\drivers\etc\hosts):
# 127.0.0.1 ictserve.local
# 127.0.0.1 www.ictserve.local