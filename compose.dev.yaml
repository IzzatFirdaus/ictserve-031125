# Development override for ICTServe Docker Compose
# Usage: docker compose -f compose.yaml -f compose.dev.yaml up

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true" # Install dev dependencies for development
    volumes:
      - ./:/var/www/html:cached
      - /var/www/html/vendor # Anonymous volume for vendor directory
      - node_modules:/var/www/html/node_modules
      - npm_cache:/var/www/.npm-cache
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - VITE_DEV_SERVER_HOST=0.0.0.0
      - VITE_DEV_SERVER_PORT=5173
    command: ["php-fpm"] # Use PHP-FPM instead of artisan serve

  # Vite development server for hot reloading
  vite:
    image: ictserve-app:latest
    container_name: ictserve-vite
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html:cached
      - /var/www/html/vendor # Anonymous volume for vendor directory
      - node_modules:/var/www/html/node_modules
      - npm_cache:/var/www/.npm-cache
    ports:
      - "5173:5173" # Default Vite port
    environment:
      - NODE_ENV=development
      - VITE_DEV_SERVER_HOST=0.0.0.0
      - VITE_DEV_SERVER_PORT=5173
    user: "82:82" # www-data user
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    depends_on:
      - app

  # Override nginx for development
  nginx:
    volumes:
      - ./:/var/www/html:cached
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf

volumes:
  node_modules:
  npm_cache:
