services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ictserve-app:latest
    container_name: ictserve-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html:cached
      - vendor:/var/www/html/vendor
      - storage:/var/www/html/storage
    expose:
      - "9000"
    depends_on:
      - db
      - redis
    env_file: ./.env.docker
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ictserve
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: 6379

  nginx:
    image: nginx:alpine
    container_name: ictserve-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html:cached
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: ictserve-db
    restart: unless-stopped
    volumes:
      - dbdata:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: ictserve
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 10

  mcp-memory:
    build:
      context: ./docker
      dockerfile: Dockerfile.mcp-memory
    image: ictserve-mcp-memory:latest
    container_name: ictserve-mcp-memory
    restart: unless-stopped
    volumes:
      - ./storage/mcp:/data
    stdin_open: true
    tty: true

  mcp-sequential-thinking:
    build:
      context: ./docker
      dockerfile: Dockerfile.mcp-sequential-thinking
    image: ictserve-mcp-sequential-thinking:latest
    container_name: ictserve-mcp-sequential-thinking
    restart: unless-stopped
    environment:
      - DISABLE_THOUGHT_LOGGING=false
    stdin_open: true
    tty: true

  mcp-playwright:
    build:
      context: ./docker
      dockerfile: Dockerfile.mcp-playwright
    image: ictserve-mcp-playwright:latest
    container_name: ictserve-mcp-playwright
    restart: unless-stopped
    stdin_open: true
    tty: true
    shm_size: 2gb

  mcp-chrome-devtools:
    build:
      context: ./docker
      dockerfile: Dockerfile.mcp-chrome-devtools
    image: ictserve-mcp-chrome-devtools:latest
    container_name: ictserve-mcp-chrome-devtools
    restart: unless-stopped
    stdin_open: true
    tty: true

  # Mimir Services
  neo4j:
    image: neo4j:5.15-community
    container_name: ictserve-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    environment:
      NEO4J_AUTH: neo4j/MxXhTKH3qntipYLa1e0QOluJ
      NEO4J_dbms_memory_pagecache_size: 512M
      NEO4J_dbms_memory_heap_initial__size: 512M
      NEO4J_dbms_memory_heap_max__size: 2G
      NEO4J_PLUGINS: '["apoc"]'
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p MxXhTKH3qntipYLa1e0QOluJ 'RETURN 1' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  copilot-api:
    image: timothyswt/copilot-api:latest
    container_name: ictserve-copilot-api
    ports:
      - "4141:4141"
    volumes:
      - ./Mimir/copilot-data:/root/.local/share/copilot-api
    environment:
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:4141/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  mimir-server:
    build:
      context: ./Mimir
      dockerfile: Dockerfile
    image: ictserve-mimir:latest
    container_name: ictserve-mimir
    restart: unless-stopped
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: MxXhTKH3qntipYLa1e0QOluJ
      NODE_ENV: production
      PORT: 3000
      WORKSPACE_ROOT: /workspace
      HOST_WORKSPACE_ROOT: /var/www/html
      MIMIR_DEFAULT_PROVIDER: copilot
      MIMIR_LLM_API: http://copilot-api:4141
      MIMIR_LLM_API_PATH: /v1/chat/completions
      MIMIR_LLM_API_MODELS_PATH: /v1/models
      MIMIR_LLM_API_KEY: dummy-key
      MIMIR_DEFAULT_MODEL: gpt-4.1
      MIMIR_EMBEDDINGS_ENABLED: true
      MIMIR_EMBEDDINGS_PROVIDER: copilot
      MIMIR_EMBEDDINGS_MODEL: text-embedding-3-small
      MIMIR_EMBEDDINGS_API: http://copilot-api:4141
      MIMIR_EMBEDDINGS_API_PATH: /v1/embeddings
      MIMIR_EMBEDDINGS_DIMENSIONS: 1536
      MIMIR_EMBEDDINGS_CHUNK_SIZE: 512
      MIMIR_AUTO_INDEX_DOCS: true
      MIMIR_ENABLE_SECURITY: false
    volumes:
      - ./Mimir/data:/app/data
      - ./Mimir/logs:/app/logs
      - ./:/workspace:ro
    ports:
      - "9042:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      neo4j:
        condition: service_healthy
      copilot-api:
        condition: service_started

  redis:
    image: redis:7
    container_name: ictserve-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  dbdata:
  vendor:
  storage:
  neo4j-data:
  neo4j-logs:
  redis-data:
